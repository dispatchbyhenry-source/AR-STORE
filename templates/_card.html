<article class="bg-white border border-red-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col"><a href="{{ url_for('product_detail',product_id=p.id) }}" class="h-52 overflow-hidden relative"><img src="{{ p.image }}" alt="{{ p.name }}" class="w-full h-full object-cover"><span class="absolute top-2 left-2 bg-white/90 px-2 py-1 rounded text-[10px] font-bold">{{ p.category }}</span>{% if p.badge %}<span class="absolute top-2 right-2 bg-red-600 text-white px-2 py-1 rounded text-[10px] font-bold">{{ p.badge }}</span>{% endif %}</a><div class="p-4 flex flex-col grow"><div class="text-xs star">★ <b class="text-slate-700">{{ p.rating }}</b> <span class="text-slate-400">({{ p.reviews_count }})</span></div><h3 class="font-bold text-sm mt-1">{{ p.name }}</h3><div class="flex flex-wrap gap-1 my-3">{% for size in p.sizes %}<span class="bg-red-50 text-red-700 rounded px-2 py-1 text-[10px] font-bold">{{ size }}</span>{% endfor %}</div><div class="mt-auto flex justify-between items-center"><b class="price" data-pkr="{{ p.price }}"></b><a href="{{ url_for('product_detail',product_id=p.id) }}" class="text-xs bg-red-50 text-red-600 p-2 rounded-lg font-bold">View product</a></div></div></article>
