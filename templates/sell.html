{% extends 'base.html' %}{% block content %}<main class="max-w-2xl mx-auto px-4 py-10 w-full"><form method="post" class="bg-white border border-red-100 rounded-3xl p-7 space-y-4"><h1 class="text-2xl font-black">List your product</h1><p class="text-sm text-slate-500">Submit a product for the AR Shopping World team to review.</p><input required name="seller_name" placeholder="Your full name" class="w-full border rounded-xl p-3 text-sm"><input required name="title" placeholder="Item title" class="w-full border rounded-xl p-3 text-sm"><div class="grid sm:grid-cols-2 gap-4"><select name="category" class="border rounded-xl p-3 text-sm"><option>Shoes</option><option>Pants</option><option>Shirts</option><option>Jackets</option><option>Wallets</option><option>Purses</option><option>Belts</option></select><input required min="1" type="number" name="price" placeholder="Asking price (USD)" class="border rounded-xl p-3 text-sm"></div><textarea required name="description" rows="5" placeholder="Describe condition, available size(s), colour and material" class="w-full border rounded-xl p-3 text-sm"></textarea><button class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold">Submit for review</button></form></main>{% endblock %}
